apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  # NodePort para poder acceder desde fuera del cluster en Minikube
  # En producción real usaríamos LoadBalancer o Ingress
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
